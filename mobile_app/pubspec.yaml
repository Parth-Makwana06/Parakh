name: metrologylens_ai
description: LMPC 2011 Field Inspector App for Legal Metrology Department
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  image_picker: ^1.2.3
  camera: ^0.12.0
  url_launcher: ^6.3.2
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.3.2
  geolocator: ^13.0.1
  geocoding: ^5.0.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.jpg